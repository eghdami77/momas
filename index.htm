<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسم مماس بر دایره از نقطه خارج از آن</title>
<style>
  * { box-sizing: border-box; }
  body{
    margin:0;
    padding:20px;
    background: linear-gradient(160deg,#0a1445,#0d1b5c 60%,#081038);
    font-family: Tahoma, Arial, sans-serif;
    color:#fff;
    text-align:center;
  }
  h1{
    font-size: clamp(18px,3vw,28px);
    margin-bottom: 18px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:10px;
  }
  .btn{
    padding:12px 18px;
    border:3px solid #000;
    border-radius:10px;
    font-size:14px;
    font-weight:bold;
    color:#fff;
    cursor:pointer;
    box-shadow: 0 6px 0 #000, 0 8px 12px rgba(0,0,0,0.45);
    transition: transform .08s ease, box-shadow .08s ease, filter .08s ease;
    font-family: inherit;
    user-select:none;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn:active{
    transform: translateY(5px);
    box-shadow: 0 1px 0 #000, 0 2px 6px rgba(0,0,0,0.4);
    filter: grayscale(1) brightness(0.75) !important;
  }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .blue{ background:#0d47a1; }
  .orange{ background:#ef6c00; }
  .red{ background:#c62828; }
  .yellow{ background:#f9a825; color:#1a1a1a; }
  .navy{ background:#1a1a5e; }

  .panel{
    display:flex; flex-wrap:wrap; justify-content:center; gap:20px;
    align-items:center; margin-bottom:16px; font-size:14px;
  }
  .panel label{ background:rgba(255,255,255,0.08); padding:6px 12px; border-radius:8px; }
  input[type=range]{ vertical-align:middle; }
  select{ border-radius:6px; padding:3px 6px; }

  .board-wrap{
    position:relative;
    display:inline-block;
    margin: 10px auto;
  }
  #canvas{
    background:#ffffff;
    border:9px solid #141452;
    border-radius:14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 3px #2b2b7a;
    display:block;
    max-width:92vw;
    touch-action:none;
    cursor:crosshair;
  }
  .sticker{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    box-shadow:0 6px 10px rgba(0,0,0,0.45);
    z-index:5;
  }
  .sticker1{
    width:38px;height:38px; top:-18px; left:-18px;
    background: radial-gradient(circle at 30% 30%, #fff, #4fc3f7 55%, #01579b 100%);
    animation: floatA 3.6s ease-in-out infinite;
  }
  .sticker2{
    width:26px;height:26px; top:-12px; right:20px;
    background: radial-gradient(circle at 30% 30%, #fff, #ffb74d 55%, #e65100 100%);
    animation: floatB 4.2s ease-in-out infinite;
    animation-delay:.6s;
  }
  .sticker3{
    width:20px;height:20px; bottom:-10px; left:40px;
    background: radial-gradient(circle at 30% 30%, #fff, #ef5350 55%, #b71c1c 100%);
    animation: floatA 3s ease-in-out infinite;
    animation-delay:1.1s;
  }
  @keyframes floatA{
    0%,100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-16px) translateX(6px); }
  }
  @keyframes floatB{
    0%,100%{ transform: translateY(0) translateX(0) rotate(0deg); }
    50%{ transform: translateY(14px) translateX(-8px) rotate(20deg); }
  }

  .info-box{
    width: 600px;
    max-width:92vw;
    min-height:70px;
    background:#ffffff;
    color:#111;
    border:2px solid #141452;
    border-radius:10px;
    margin: 12px auto 0;
    padding:12px 16px;
    text-align:right;
    font-size:15px;
    line-height:2;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  footer{
    margin-top:26px;
    font-size:13px;
    color:#cfd6ff;
    opacity:0.85;
  }
</style>
</head>
<body>

<h1>رسم مماس بر دایره از نقطه خارج از آن</h1>

<div class="controls">
  <button id="playBtn" class="btn blue">▶️ پخش آهنگ</button>
  <button id="drawCircleBtn" class="btn orange">رسم دایره</button>
  <button id="selectPointBtn" class="btn red">انتخاب نقطه خارج دایره</button>
  <button id="tangentBtn" class="btn yellow">رسم مماس</button>
  <button id="resetBtn" class="btn navy">شروع دوباره</button>
</div>

<div class="panel">
  <label>شعاع دایره: <input type="range" id="radiusSlider" min="30" max="140" value="65"></label>
  <label>سرعت انیمیشن:
    <select id="speedSelect">
      <option value="slow">کند</option>
      <option value="medium" selected>متوسط</option>
      <option value="fast">تند</option>
      <option value="veryfast">خیلی تند</option>
    </select>
  </label>
</div>

<div class="board-wrap">
  <div class="sticker sticker1"></div>
  <div class="sticker sticker2"></div>
  <div class="sticker sticker3"></div>
  <canvas id="canvas" width="600" height="450"></canvas>
</div>

<div class="info-box" id="infoBox">برای شروع، دکمهٔ «رسم دایره» را بزنید.</div>

<audio id="audio" src="https://mixkit.ir/wp-content/uploads/2022/03/XWorld-S8.mp3" preload="none"></audio>

<footer>تهیه شده توسط اقدامی مقدم</footer>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const infoBox = document.getElementById('infoBox');
const radiusSlider = document.getElementById('radiusSlider');
const speedSelect = document.getElementById('speedSelect');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const drawCircleBtn = document.getElementById('drawCircleBtn');
const selectPointBtn = document.getElementById('selectPointBtn');
const tangentBtn = document.getElementById('tangentBtn');
const resetBtn = document.getElementById('resetBtn');

let O = null;
let r = parseInt(radiusSlider.value);
let M = null;
let mode = null;
let draggingCenter = false;
let movedDuringDrag = false;
let permanentItems = [];
let currentAnim = null;
let session = 0;
let playing = false;

/* ---------- تبدیل اعداد به فارسی ---------- */
const faDigitsMap = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
function toFa(input){
  return String(input).replace(/[0-9]/g, d => faDigitsMap[d]);
}

/* ---------- صدای کلیک ---------- */
function playClick(){
  try{
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'square';
    osc.frequency.value = 620;
    gain.gain.setValueAtTime(0.15, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.12);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.12);
  }catch(e){}
}
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click', ()=> playClick());
});

/* ---------- پخش موسیقی ---------- */
playBtn.addEventListener('click', ()=>{
  if(playing){
    audio.pause();
    playBtn.textContent = '▶️ پخش آهنگ';
  }else{
    audio.play().catch(()=>{});
    playBtn.textContent = '⏸️ توقف آهنگ';
  }
  playing = !playing;
});
audio.addEventListener('ended', ()=>{
  playing = false;
  playBtn.textContent = '▶️ پخش آهنگ';
});

/* ---------- ابزارهای هندسی ---------- */
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function midpoint(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function angleFrom(c,p){ return Math.atan2(p.y-c.y, p.x-c.x); }
function normDelta(a1,a2){
  let d = a2-a1;
  while(d > Math.PI) d -= 2*Math.PI;
  while(d < -Math.PI) d += 2*Math.PI;
  return d;
}
function clampCenter(x,y,radius){
  const margin = 10;
  return {
    x: Math.min(Math.max(x, radius+margin), canvas.width - radius - margin),
    y: Math.min(Math.max(y, radius+margin), canvas.height - radius - margin)
  };
}
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY };
}
function setInfo(html){ infoBox.innerHTML = html; }
function baseDur(ms){
  const v = speedSelect.value;
  let mul = 1;
  if(v==='fast') mul = 0.5;
  else if(v==='slow') mul = 2;
  else if(v==='veryfast') mul = 0.22;
  return ms*mul;
}

/* ---------- رسم ---------- */
function drawItem(item, progress){
  if(item.type === 'arc'){
    const cur = item.a1 + item.delta*progress;
    ctx.beginPath();
    ctx.arc(item.cx, item.cy, item.radius, item.a1, cur, item.delta<0);
    ctx.strokeStyle = item.color; ctx.lineWidth = item.width||1.5;
    if(item.dash) ctx.setLineDash(item.dash); else ctx.setLineDash([]);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if(item.type === 'line'){
    const x2 = item.x1 + (item.x2-item.x1)*progress;
    const y2 = item.y1 + (item.y2-item.y1)*progress;
    ctx.beginPath(); ctx.moveTo(item.x1,item.y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = item.color; ctx.lineWidth = item.width||2; ctx.lineCap='round';
    if(item.dash) ctx.setLineDash(item.dash); else ctx.setLineDash([]);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if(item.type === 'circle'){
    ctx.beginPath();
    ctx.arc(item.cx, item.cy, item.radius, 0, Math.PI*2*progress);
    ctx.strokeStyle = item.color; ctx.lineWidth = item.width||2; ctx.stroke();
  } else if(item.type === 'point'){
    if(progress < 1) return;
    ctx.beginPath(); ctx.arc(item.x, item.y, 4, 0, Math.PI*2);
    ctx.fillStyle = item.color || '#000'; ctx.fill();
    ctx.font = 'bold 15px Tahoma';
    ctx.fillStyle = item.color || '#000';
    ctx.fillText(item.label, item.x+8, item.y-8);
  }
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(O){
    ctx.beginPath();
    ctx.arc(O.x, O.y, r, 0, Math.PI*2);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  permanentItems.forEach(it => drawItem(it, 1));
  if(currentAnim) drawItem(currentAnim.item, currentAnim.progress);

  if(O){
    ctx.beginPath(); ctx.arc(O.x,O.y,3,0,Math.PI*2);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.font = 'bold 17px Tahoma'; ctx.fillStyle = '#000';
    ctx.fillText('O', O.x+8, O.y-8);
  }
  if(M){
    ctx.beginPath(); ctx.arc(M.x,M.y,3,0,Math.PI*2);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.font = 'bold 17px Tahoma'; ctx.fillStyle = '#000';
    ctx.fillText('M', M.x+8, M.y-8);
  }
}

function animateItem(item, duration, cb){
  const mySession = session;
  const start = performance.now();
  function frame(now){
    if(session !== mySession) return;
    const t = Math.min((now-start)/duration, 1);
    currentAnim = {item, progress:t};
    redraw();
    if(t < 1){
      requestAnimationFrame(frame);
    }else{
      currentAnim = null;
      permanentItems.push(item);
      redraw();
      if(cb) cb();
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- تعامل با دایره ---------- */
radiusSlider.addEventListener('input', ()=>{
  r = parseInt(radiusSlider.value);
  if(O){
    O = clampCenter(O.x, O.y, r);
    if(M || permanentItems.length){
      M = null; permanentItems = []; session++;
      setInfo('شعاع دایره تغییر کرد. لطفاً دوباره نقطهٔ خارج از دایره را انتخاب کنید.');
    }
  }
  redraw();
});

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('touchstart', startDrag, {passive:true});
function startDrag(e){
  const pos = getPos(e);
  movedDuringDrag = false;

  if(mode === 'draw-circle' && !O){
    O = clampCenter(pos.x, pos.y, r);
    mode = null;
    setInfo('دایره رسم شد. برای جابه‌جایی، روی دایره کلیک و درگ کنید یا با نوار لغزنده شعاع را تغییر دهید. سپس دکمهٔ «انتخاب نقطه خارج دایره» را بزنید.');
    redraw();
    return;
  }
  if(O && dist(pos,O) <= r){
    draggingCenter = true;
    if(M || permanentItems.length){
      M = null; permanentItems = []; session++;
      setInfo('دایره جابه‌جا شد. لطفاً دوباره نقطهٔ خارج از دایره را انتخاب کنید.');
    }
  }
}
canvas.addEventListener('mousemove', doDrag);
canvas.addEventListener('touchmove', doDrag, {passive:true});
function doDrag(e){
  if(draggingCenter && O){
    const pos = getPos(e);
    O = clampCenter(pos.x, pos.y, r);
    movedDuringDrag = true;
    redraw();
  }
}
canvas.addEventListener('mouseup', ()=> draggingCenter=false);
canvas.addEventListener('touchend', ()=> draggingCenter=false);

canvas.addEventListener('click', (e)=>{
  if(movedDuringDrag){ movedDuringDrag = false; return; }
  const pos = getPos(e);
  if(mode === 'select-point'){
    if(!O){ setInfo('ابتدا با دکمهٔ «رسم دایره»، دایره را رسم کنید.'); return; }
    if(dist(pos,O) <= r){
      setInfo('نقطهٔ انتخابی باید <b>خارج</b> از دایره باشد. دوباره روی صفحه کلیک کنید.');
      return;
    }
    M = pos;
    mode = null;
    redraw();
    setInfo('نقطهٔ M مشخص شد. حالا دکمهٔ «رسم مماس» را بزنید.');
  }
});

/* ---------- دکمه‌ها ---------- */
drawCircleBtn.addEventListener('click', ()=>{
  session++;
  O = null; M = null; permanentItems = []; currentAnim = null;
  mode = 'draw-circle';
  setInfo('روی کادر سفید کلیک کنید تا مرکز دایره (O) مشخص شود.');
  redraw();
});

selectPointBtn.addEventListener('click', ()=>{
  if(!O){ setInfo('ابتدا با دکمهٔ «رسم دایره»، دایره را رسم کنید.'); return; }
  mode = 'select-point';
  setInfo('مرحلهٔ ۲: انتخاب نقطهٔ خارج دایره<br>با زدن روی صفحه (خارج از دایره)، یک نقطه انتخاب کنید. این نقطه با نام <b>M</b> نام‌گذاری می‌شود.');
});

tangentBtn.addEventListener('click', ()=>{
  if(!O || !M){ setInfo('ابتدا دایره را رسم کرده و نقطهٔ M را انتخاب کنید.'); return; }
  tangentBtn.disabled = true;
  runTangentConstruction(()=>{ tangentBtn.disabled = false; });
});

resetBtn.addEventListener('click', ()=>{
  session++;
  O = null; M = null; permanentItems = []; currentAnim = null; mode = null;
  tangentBtn.disabled = false;
  setInfo('برای شروع، دکمهٔ «رسم دایره» را بزنید.');
  redraw();
});

/* ---------- ساخت انیمیشنی مماس ---------- */
function runTangentConstruction(onDone){
  const mySession = session;
  const d = dist(O,M);
  const N = midpoint(O,M);
  const radiusArc = d*0.7;
  const h = Math.sqrt(Math.max(radiusArc*radiusArc - (d/2)*(d/2), 1));
  const ux = (M.x-O.x)/d, uy = (M.y-O.y)/d;
  const px = -uy, py = ux;
  const P1 = {x:N.x+px*h, y:N.y+py*h};
  const P2 = {x:N.x-px*h, y:N.y-py*h};

  const aO1 = angleFrom(O,P1), aO2 = angleFrom(O,P2), deltaO = normDelta(aO1,aO2);
  const aM1 = angleFrom(M,P1), aM2 = angleFrom(M,P2), deltaM = normDelta(aM1,aM2);

  function alive(){ return session === mySession; }

  setInfo('ابتدا خط <b>OM</b> را به‌صورت خط‌چین رسم می‌کنیم.');

  const omDashed = {type:'line', x1:O.x, y1:O.y, x2:M.x, y2:M.y, color:'#555', width:1.5, dash:[7,5]};
  animateItem(omDashed, baseDur(600), ()=>{
    if(!alive()) return;
    setInfo('حالا برای پیدا کردن عمود منصف OM، دو کمان مساوی به شعاعی بیشتر از نصف OM از دو سر O و M رسم می‌کنیم.');
    const arcO = {type:'arc', cx:O.x, cy:O.y, radius:radiusArc, a1:aO1, delta:deltaO, color:'#999', width:1.5};
    animateItem(arcO, baseDur(1000), ()=>{
      if(!alive()) return;
      setTimeout(()=>{
        if(!alive()) return;
        const arcM = {type:'arc', cx:M.x, cy:M.y, radius:radiusArc, a1:aM1, delta:deltaM, color:'#999', width:1.5};
        animateItem(arcM, baseDur(1000), ()=>{
          if(!alive()) return;
          setInfo('نقاط برخورد دو کمان را به هم وصل می‌کنیم تا عمود منصف OM به‌دست آید.');
          const bis = {type:'line', x1:P1.x, y1:P1.y, x2:P2.x, y2:P2.y, color:'#777', width:1.5};
          animateItem(bis, baseDur(700), ()=>{
            if(!alive()) return;
            permanentItems.push({type:'point', x:N.x, y:N.y, label:'N', color:'#000'});
            redraw();
            setTimeout(()=>{
              if(!alive()) return;
              setInfo('نقطهٔ وسط OM یعنی <b>N</b> پیدا شد. با علامت تیک روی ON و MN نشان می‌دهیم که این دو پاره‌خط با هم برابرند.');
              const tickLen = 9;
              const midON = midpoint(O,N);
              const midNM = midpoint(N,M);
              const tick1 = {type:'line', x1:midON.x-px*tickLen, y1:midON.y-py*tickLen, x2:midON.x+px*tickLen, y2:midON.y+py*tickLen, color:'#000', width:2.5};
              animateItem(tick1, baseDur(300), ()=>{
                if(!alive()) return;
                const tick2 = {type:'line', x1:midNM.x-px*tickLen, y1:midNM.y-py*tickLen, x2:midNM.x+px*tickLen, y2:midNM.y+py*tickLen, color:'#000', width:2.5};
                animateItem(tick2, baseDur(300), ()=>{
                  if(!alive()) return;
                  setTimeout(()=>{
                    if(!alive()) return;
                    setInfo('حالا دایرهٔ نارنجی‌رنگ به مرکز N و شعاع NO رسم می‌شود.');
                    setTimeout(()=>{
                      if(!alive()) return;
                      const orangeCircle = {type:'circle', cx:N.x, cy:N.y, radius:d/2, color:'#ff8c00', width:2.5};
                      animateItem(orangeCircle, baseDur(1500), ()=>{
                        if(!alive()) return;
                        setTimeout(()=>{
                          if(!alive()) return;
                          setInfo('نقاط برخورد دایرهٔ جدید با دایرهٔ ایجادشده در مرحلهٔ قبل را مشخص می‌کنیم.');
                          setTimeout(()=>{
                            if(!alive()) return;
                            const D = dist(O,N);
                            const a = (r*r - (d/2)*(d/2) + D*D)/(2*D);
                            const hh = Math.sqrt(Math.max(r*r - a*a, 0));
                            const midx = O.x + a*(N.x-O.x)/D, midy = O.y + a*(N.y-O.y)/D;
                            const perpx = -(N.y-O.y)/D, perpy = (N.x-O.x)/D;
                            const H1 = {x:midx+perpx*hh, y:midy+perpy*hh};
                            const H2 = {x:midx-perpx*hh, y:midy-perpy*hh};

                            permanentItems.push({type:'point', x:H1.x, y:H1.y, label:toFa('H1'), color:'#000'});
                            redraw();
                            setTimeout(()=>{
                              if(!alive()) return;
                              permanentItems.push({type:'point', x:H2.x, y:H2.y, label:toFa('H2'), color:'#000'});
                              redraw();
                              setTimeout(()=>{
                                if(!alive()) return;
                                setInfo('از M به ' + toFa('H1') + ' و ' + toFa('H2') + ' خط رسم می‌کنیم.');
                                setTimeout(()=>{
                                  if(!alive()) return;
                                  const line1 = {type:'line', x1:M.x, y1:M.y, x2:H1.x, y2:H1.y, color:'#000', width:2};
                                  animateItem(line1, baseDur(800), ()=>{
                                    if(!alive()) return;
                                    const line2 = {type:'line', x1:M.x, y1:M.y, x2:H2.x, y2:H2.y, color:'#000', width:2};
                                    animateItem(line2, baseDur(800), ()=>{
                                      if(!alive()) return;
                                      setInfo('دو مماس از نقطهٔ M بر دایره رسم شد. 🎉');
                                      const colors = ['#ff0000','#ff9800','#ffeb3b','#1565c0','#2e7d32'];
                                      let idx = 0;
                                      const pulseId = setInterval(()=>{
                                        if(!alive()){ clearInterval(pulseId); return; }
                                        idx = (idx+1)%colors.length;
                                        line1.color = colors[idx]; line1.width = 5;
                                        line2.color = colors[idx]; line2.width = 5;
                                        redraw();
                                      }, baseDur(300));
                                      setTimeout(()=>{
                                        clearInterval(pulseId);
                                        if(!alive()) return;
                                        line1.color = '#d32f2f'; line1.width = 5;
                                        line2.color = '#d32f2f'; line2.width = 5;
                                        redraw();
                                        setInfo('رسم مماس با موفقیت کامل شد. ✅ خطوط M' + toFa('H1') + ' و M' + toFa('H2') + ' مماس‌های دایره هستند.');
                                        if(onDone) onDone();
                                      }, baseDur(3000));
                                    });
                                  });
                                }, baseDur(800));
                              }, baseDur(500));
                            }, baseDur(700));
                          }, baseDur(900));
                        }, baseDur(800));
                      });
                    }, baseDur(600));
                  }, baseDur(500));
                });
              });
            }, baseDur(500));
          });
        });
      }, baseDur(1000));
    });
  });
}

redraw();
</script>
</body>
</html>
